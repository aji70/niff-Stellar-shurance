name: Frontend i18n CI

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/messages/**'
      - 'frontend/scripts/check-translations.js'
      - 'frontend/scripts/check-plurals.js'
      - '.github/workflows/frontend-i18n-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/messages/**'
      - 'frontend/scripts/check-translations.js'
      - 'frontend/scripts/check-plurals.js'
      - '.github/workflows/frontend-i18n-ci.yml'

jobs:
  locale-checks:
    name: Locale parity & plural checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fails the build when a key present in the base (en) locale is
      # missing from any other supported locale.
      - name: Check locale key parity
        run: npm run check-translations

      # Fails the build when a countable-looking string (e.g. "{days} days")
      # lacks ICU plural syntax.
      - name: Check ICU plural forms
        run: npm run check-plurals

  # Testing infrastructure layers for the rebuild (issue #1542).
  # These jobs run on the same path filters as the locale checks so the
  # testing stack is validated whenever the frontend changes.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  unit:
    name: Unit tests (Jest + RTL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Coverage threshold is enforced by jest.config.js.
      - name: Run unit tests with coverage
        run: npm run test:coverage

  storybook:
    name: Storybook tests (interaction + axe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Runs the Storybook test runner (interaction + axe) against a
      # static Storybook build.
      - name: Run Storybook tests
        run: npm run test-storybook:ci

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright, mocked backend)
    # E2E runs on main only, per issue #1542.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # E2E suites use a mocked wallet and mocked backend; no real
      # wallets or funds are required.
      - name: Run E2E tests
        run: npm run test:e2e
